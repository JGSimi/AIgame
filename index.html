function vec(s,d=[0,0,0]){return (s||d.join(' ')).trim().split(/\s+/).map(Number)}function quat(s){const q=vec(s,[1,0,0,0]);return new THREE.Quaternion(q[1],q[2],q[3],q[0])}function color(s){const a=vec(s,[.45,.3,.18,1]);return new THREE.Color(a[0],a[1],a[2])}function mat(rgba,transparent=false){const a=vec(rgba,[.45,.3,.18,1]);return new THREE.MeshStandardMaterial({color:new THREE.Color(a[0],a[1],a[2]),transparent:a[3]<.99||transparent,opacity:a[3],roughness:.58,metalness:.02,side:THREE.DoubleSide})}
async function loadFlyBody(){try{const xmlText=await (await fetch(BASE+'fruitfly.xml')).text(),xml=new DOMParser().parseFromString(xmlText,'application/xml'),meshMap=new Map(),materialMap=new Map();xml.querySelectorAll('asset > material').forEach(m=>materialMap.set(m.getAttribute('name'),m.getAttribute('rgba')||'.45 .3 .18 1'));xml.querySelectorAll('asset > mesh').forEach(m=>meshMap.set(m.getAttribute('name'),{file:m.getAttribute('file'),scale:vec(m.getAttribute('scale'),[1,1,1])}));const loader=new OBJLoader();function direct(el,tag){return [...el.children].filter(x=>x.tagName===tag)}function build(body,parent){const g=new THREE.Group(),name=body.getAttribute('name')||'';g.name=name;const p=vec(body.getAttribute('pos'));g.position.set(...p);g.quaternion.copy(quat(body.getAttribute('quat')));g.userData.baseQ=g.quaternion.clone();bodyNodes.set(name,g);parent.add(g);const js=direct(body,'joint').filter(j=>j.getAttribute('type')!=='free');if(js.length){g.userData.joints=js.map(j=>({name:j.getAttribute('name')||'',axis:new THREE.Vector3(...vec(j.getAttribute('axis'),[1,0,0])).normalize(),range:vec(j.getAttribute('range'),[-1,1])}));jointState.push(g)}for(const ge of direct(body,'geom')){const mn=ge.getAttribute('mesh');if(!mn||!meshMap.has(mn))continue;const info=meshMap.get(mn),holder=new THREE.Group(),gp=vec(ge.getAttribute('pos'));holder.position.set(...gp);holder.quaternion.copy(quat(ge.getAttribute('quat')));holder.scale.set(...info.scale);g.add(holder);loader.load(A+info.file,obj=>{const rgba=materialMap.get(ge.getAttribute('material'))||'.45 .3 .18 1';obj.traverse(o=>{if(o.isMesh){o.material=mat(rgba,mn.includes('membrane'));o.castShadow=!mobile;o.receiveShadow=false}});holder.add(obj);meshCount++;meshesEl.textContent=meshCount},undefined,()=>{});}direct(body,'body').forEach(ch=>build(ch,g));return g}const thorax=xml.querySelector('worldbody > body[name="thorax"]');if(!thorax)throw Error('thorax');build(thorax,flyRoot);statusEl.textContent='FlyBody oficial carreg class Brain{constructor(n,e){this.n=n;this.e=e;this.v=new Float32Array(n);this.f=new Uint8Array(n);this.tr=new Float32Array(n);this.b=new Float32Array(n);this.s=new Uint32Array(e);this.d=new Uint32Array(e);this.w=new Float32Array(e);this.out=n-16;for(let i=0;i<n;i++)this.b[i]=(Math.random()-.5)*.012;for(let k=0;k<e;k++){this.s[k]=Math.random()*n|0;this.d[k]=Math.random()*n|0;this.w[k]=(Math.random()<.18?-1:1)*(.015+Math.random()*.055)}this.sp=0}reset(){this.v.fill(0);this.f.fill(0);this.tr.fill(0)}step(inp,r){for(let i=0;i<24;i++)this.v[i]+=inp[i]||0;const add=new Float32Array(this.n);let sp=0;for(let i=0;i<this.n;i++){if(this.v[i]>.36){this.f[i]=1;this.v[i]=-.08;this.tr[i]=1;sp++}else{this.f[i]=0;this.v[i]=this.v[i]*.944+this.b[i];this.tr[i]*=.955}}for(let k=0;k<this.e;k++){const a=this.s[k],b=this.d[k];if(this.f[a])add[b]+=this.w[k];if(r&&this.f[a])this.w[k]=THREE.MathUtils.clamp(this.w[k]+r*this.tr[b]*.0005,-.16,.16)}for(let i=0;i<this.n;i++)this.v[i]+=add[i];this.sp=this.sp*.9+sp;let q=[0,0,0,0];for(let i=0;i<16;i++)q[i>>2]+=Math.tanh(this.v[this.out+i]*3);return{f:Math.tanh(q[0]*.5),t:Math.tanh(q[1]*.5),s:Math.tanh(q[2]*.5),l:Math.tanh(q[3]*.5)}}}const brain=new Brain(N,E);neuronsEl.textContent=N.toLocaleString('pt-BR');synapsesEl.textContent=E.toLocaleString('pt-BR');

function train(dt){const p=locomotion.position;if(target&&(game.value==='forage'||game.value==='maze'||game.value==='light')){const d=p.distanceTo(target.position);reward+=game.value==='light'?Math.max(-.002,.003-Math.abs(d-1.3)*.001):Math.max(-.001,.0014-d*.00007);if(d<.55){rewardTotal+=10;scoreEl.textContent=rewardTotal.toFixed(0);reward+=.25;energy=Math.min(1,energy+.25);target.position.set(rnd(-7,7),target.position.y,rnd(-7,7));pop('+10')}}else if(game.value==='memory'){const m=markers[goal[goalStep]];if(m&&p.distanceTo(m.position)<.55){goalStep++;reward+=.22;rewardTotal+=8;scoreEl.textContent=rewardTotal.toFixed(0);if(goalStep>=3){episode++;episodeEl.textContent=episode;setup()}}}else if(game.value==='escape'&&predator){tmp.copy(p).sub(predator.position);const d=tmp.length();tmp.normalize();predator.position.addScaledVector(tmp,dt*1.4);if(d<.75){reward-=.3;rewardTotal-=15;scoreEl.textContent=rewardTotal.toFixed(0);episode++;episodeEl.textContent=episode;setup()}else{reward+=.001;rewardTotal+=dt*.12;scoreEl.textContent=rewardTotal.toFixed(0)}}else if(game.value==='slalom'){const m=markers[slalom];if(m&&p.distanceTo(m.position)<.55){slalom++;reward+=.2;rewardTotal+=6;scoreEl.textContent=rewardTotal.toFixed(0);if(slalom>=markers.length){episode++;episodeEl.textContent=episode;setup()}}}}
function animateJoints(spd){const t=time;for(const g of jointState){const base=g.userData.baseQ.clone(),joints=g.userData.joints||[];for(const j of joints){let a=0,n=j.name,phase=(n.includes('T2')?2.1:n.includes('T3')?4.2:0)+(n.includes('right')?Math.PI:0),wave=Math.sin(t*(5+spd*7)+phase);if(n.includes('extend_coxa'))a=.24*wave;if(n.includes('abduct_coxa'))a=.12*wave;if(n.includes('twist_coxa'))a=.08*wave;if(n.includes('extend_femur'))a=.38*wave;if(n.includes('extend_tibia'))a=-.55*wave;if(n.includes('wing_yaw'))a=Math.sin(t*38+(n.includes('right')?Math.PI:0))*.7;if(n.includes('wing_roll'))a=Math.sin(t*38+(n.includes('right')?Math.PI:0))*.25;if(n.includes('wing_pitch'))a=.15*Math.sin(t*38);if(n.includes('abdomen'))a=.03*Math.sin(t*2.3);if(n==='head')a=.05*Math.sin(t*1.7);if(n.includes('antenna'))a=.04*Math.sin(t*2+phase);const q=new THREE.Quaternion().setFromAxisAngle(j.axis,a);base.multiply(q)}g.quaternion.copy(base)}}function step(dt){time+=dt;reward*=.92;const out=brain.step(senses(),reward),y=locomotion.rotation.y;fw.set(Math.cos(y),0,-Math.sin(y));rt.set(Math.sin(y),0,Math.cos(y));locomotion.rotation.y+=(out.t*.6+userX*.9)*1.45*dt;vel.addScaledVector(fw,(out.f*.55+.42+userY*.9)*(boost?5.8:3.2)*dt);vel.addScaledVector(rt,out.s*.3*dt);vel.multiplyScalar(Math.pow(.12,dt));const cap=boost?6.5:3.8;if(vel.length()>cap)vel.setLength(cap);locomotion.position.addScaledVector(vel,dt);locomotion.position.x=THREE.MathUtils.clamp(locomotion.position.x,-12,12);locomotion.position.z=THREE.MathUtils.clamp(locomotion.position.z,-12,12);energy=Math.max(0,energy-dt*(.003+.008*vel.length()/cap+(boost?.012:0)));energyEl.style.width=(energy*100)+'%';speedEl.textContent=vel.length().toFixed(1);spikesEl.textContent=Math.round(brain.sp).toLocaleString('pt-BR');collision();train(dt);animateJoints(Math.min(1,vel.length()/3));if(camMode===1){tmp.set(locomotion.position.x-5*Math.cos(y),3.1,locomotion.position.z+5*Math.sin(y));camera.position.lerp(tmp,.06);controls.target.lerp(locomotion.position,.1)}if(camMode===2){tmp.set(locomotion.position.x+.7*Math.cos(y),locomotion.position.y+.5,locomotion.position.z-.7*Math.sin(y));camera.position.lerp(tmp,.18);controls.target.copy(locomotion.position).addScaledVector(fw,3)}}function neuro(){nx.fillStyle='#080d14';nx.fillRect(0,0,nc.width,nc.height);for(let b=0;b<64;b++){let s=0,a=b*brain.n/64|0,z=(b+1)*brain.n/64|0;for(let i=a;i<z;i++)s+=brain.f[i];const q=Math.min(1,s/Math.max(1,(z-a)*.22)),h=4+q*(nc.height-12);nx.fillStyle=`rgba(${80+q*90},${130+q*100},255,${.32+q*.65})`;nx.fillRect(b*nc.width/64+1,nc.height-h,nc.width/64-2,h)}}
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);function readKeys(){userY=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);userX=(keys.a||keys.arrowleft?1:0)-(keys.d||keys.arrowright?1:0);boost=!!keys.shift}const joy=$('#joy');let jid=null;function jm(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.hypot(dx,dy),l=r.width*.38,k=m>l?l/m:1;userX=dx*k/l;userY=-dy*k/l}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)};joy.onpointermove=e=>{if(e.pointerId===jid)jm(e)};joy.onpointerup=e=>{if(e.pointerId===jid){jid=null;userX=userY=0}};$('#boost').onpointerdown=()=>boost=true;$('#boost').onpointerup=()=>boost=false;$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'Continuar':'Pausar'};$('#cam').onclick=()=>{camMode=(camMode+1)%3;controls.enabled=camMode===0;pop(['Órbita','Seguimento','Primeira pessoa'][camMode])};$('#reset').onclick=()=>{brain.reset();rewardTotal=0;scoreEl.textContent='0';episode=1;episodeEl.textContent='1';setup()};$('#newEpisode').onclick=()=>{episode++;episodeEl.textContent=episode;setup()};game.onchange=()=>{episode++;episodeEl.textContent=episode;setup()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
setup();loadFlyBody();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.033,(now-last)/1000);last=now;if(!paused){readKeys();step(dt)}controls.update();renderer.render(scene,camera);neuro();fpsN++;if(now-fpsT>500){fpsEl.textContent=Math.round(fpsN*1000/(now-fpsT));fpsN=0;fpsT=now}}requestAnimationFrame(frame);
