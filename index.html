<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070a0f">
<title>FlyLab 3D — NeuroSim</title>
<style>
:root{--bg:#070a0f;--panel:#111722e8;--line:#263142;--text:#eef4ff;--muted:#9dabc0;--ok:#78efb1;--warn:#ffd166;--bad:#ff7a7a;--accent:#79a8ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px);box-shadow:0 10px 35px #0008}
#top{position:fixed;z-index:8;left:10px;top:max(10px,env(safe-area-inset-top));right:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
#brand{padding:10px 12px;min-width:0;pointer-events:auto;max-width:min(620px,75vw)}
#brand h1{font-size:15px;margin:0 0 4px}
#status{font-size:11px;color:var(--muted);white-space:normal}
#actions{padding:7px;display:flex;gap:6px;pointer-events:auto}
button,select{font:inherit}
button{border:1px solid var(--line);background:#17202d;color:var(--text);border-radius:10px;padding:8px 10px;font-weight:700;min-height:38px}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);color:#08101f;border-color:transparent}
button.good{background:var(--ok);color:#07120d;border-color:transparent}
#left{position:fixed;z-index:7;left:10px;top:104px;width:250px;padding:10px;pointer-events:auto}
#right{position:fixed;z-index:7;right:10px;top:104px;width:265px;padding:10px;pointer-events:auto}
.section{margin-top:9px;padding-top:9px;border-top:1px solid #263142}
.section:first-child{margin-top:0;padding-top:0;border-top:0}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#7f8ca3;margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:#0b111a;border:1px solid #202a3a;border-radius:10px;padding:7px}
.stat b{display:block;font-size:16px}
.stat span{font-size:10px;color:var(--muted)}
select{width:100%;background:#0d1420;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}
.meter{height:7px;background:#0b1017;border-radius:999px;overflow:hidden;border:1px solid #1f2938}
.meter>i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#6c93ff,#78efb1)}
#neuroCanvas{width:100%;height:90px;display:block;background:#080d14;border:1px solid #202a3a;border-radius:9px}
#gameDesc{font-size:11px;color:var(--muted);min-height:44px}
#bottom{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;pointer-events:auto}
.pill{padding:7px 10px;border-radius:999px;background:#111722dd;border:1px solid var(--line);font-size:11px;color:#c7d2e6}
#touch{display:none;position:fixed;z-index:9;inset:auto 0 max(10px,env(safe-area-inset-bottom)) 0;pointer-events:none}
.joy{position:absolute;left:18px;bottom:0;width:118px;height:118px;border:1px solid #344157;border-radius:50%;background:#0c121bbb;pointer-events:auto;touch-action:none}
.joy:after{content:"";position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:#6e8bc9aa;border:1px solid #96b1e4}
#boost{position:absolute;right:18px;bottom:12px;width:78px;height:78px;border-radius:50%;pointer-events:auto}
#toast{position:fixed;z-index:20;left:50%;top:18%;transform:translateX(-50%);padding:10px 14px;border-radius:12px;background:#101723ee;border:1px solid var(--line);opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1}
@media(max-width:820px){
  #left{width:210px;top:92px}
  #right{width:210px;top:92px}
  #brand{max-width:62vw}
  #touch{display:block}
  #bottom{bottom:145px}
}
@media(max-width:620px){
  #left{display:none}
  #right{top:auto;bottom:145px;left:10px;right:10px;width:auto;padding:7px}
  #right .section:nth-child(n+3){display:none}
  #actions{padding:5px}
  #actions button:nth-child(2){display:none}
  #brand{max-width:68vw;padding:8px 10px}
  #brand h1{font-size:13px}
}
</style>
</head>
<body>
<div id="stage"></div>

<div id="top">
  <div id="brand" class="panel">
    <h1>🪰 FlyLab 3D — NeuroSim</h1>
    <div id="status">Inicializando WebGL e cérebro recorrente…</div>
  </div>
  <div id="actions" class="panel">
    <button id="pause">Pausar</button>
    <button id="cam">Câmera</button>
    <button id="reset" class="primary">Reset</button>
  </div>
</div>

<div id="left" class="panel">
  <div class="section">
    <div class="label">Treinamento</div>
    <select id="game">
      <option value="forage">1. Forrageamento</option>
      <option value="maze">2. Labirinto de odor</option>
      <option value="light">3. Fototaxia</option>
      <option value="memory">4. Memória sequencial</option>
      <option value="escape">5. Fuga do predador</option>
      <option value="slalom">6. Slalom / obstáculos</option>
    </select>
    <div id="gameDesc"></div>
    <button id="newEpisode" class="good" style="width:100%">Novo episódio</button>
  </div>
  <div class="section">
    <div class="label">Estado</div>
    <div class="grid">
      <div class="stat"><b id="score">0</b><span>recompensa</span></div>
      <div class="stat"><b id="episode">1</b><span>episódio</span></div>
      <div class="stat"><b id="fps">60</b><span>FPS</span></div>
      <div class="stat"><b id="speed">0.0</b><span>velocidade</span></div>
    </div>
  </div>
  <div class="section">
    <div class="label">Energia</div>
    <div class="meter"><i id="energyBar"></i></div>
  </div>
</div>

<div id="right" class="panel">
  <div class="section">
    <div class="label">Cérebro</div>
    <div class="grid">
      <div class="stat"><b id="neurons">0</b><span>neurônios</span></div>
      <div class="stat"><b id="synapses">0</b><span>sinapses</span></div>
      <div class="stat"><b id="spikes">0</b><span>spikes/s</span></div>
      <div class="stat"><b id="plastic">ON</b><span>plasticidade</span></div>
    </div>
  </div>
  <div class="section">
    <div class="label">Atividade neural</div>
    <canvas id="neuroCanvas" width="500" height="180"></canvas>
  </div>
  <div class="section">
    <div class="label">Sensores</div>
    <div id="sensorText" style="font-size:11px;color:var(--muted)">—</div>
  </div>
</div>

<div id="bottom">
  <div class="pill" id="hint">WASD / joystick para interferir · cérebro controla sozinho</div>
</div>

<div id="touch">
  <div id="joy" class="joy"></div>
  <button id="boost">BOOST</button>
</div>

<div id="toast"></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/+esm";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js/+esm";

const stage=document.getElementById("stage");
const statusEl=document.getElementById("status");
const scoreEl=document.getElementById("score"),episodeEl=document.getElementById("episode"),fpsEl=document.getElementById("fps");
const speedEl=document.getElementById("speed"),neuronsEl=document.getElementById("neurons"),synapsesEl=document.getElementById("synapses");
const spikesEl=document.getElementById("spikes"),energyBar=document.getElementById("energyBar"),sensorText=document.getElementById("sensorText");
const gameSel=document.getElementById("game"),gameDesc=document.getElementById("gameDesc"),toast=document.getElementById("toast");
const ncv=document.getElementById("neuroCanvas"),nctx=ncv.getContext("2d");

let paused=false,camMode=0,episode=1,totalReward=0,energy=1,boost=false;
let userX=0,userY=0,last=performance.now(),fpsAcc=0,fpsLast=performance.now();
let target=null,predator=null,goalSequence=[],memoryStep=0,gameTimer=0;
const obstacles=[],markers=[];
const DPR=Math.min(devicePixelRatio||1,2);
const mobile=matchMedia("(max-width:820px)").matches || /iPhone|iPad|Android/i.test(navigator.userAgent);
const HIGH=!mobile && (navigator.hardwareConcurrency||4)>=8;
const N=HIGH?4096:(mobile?1536:2560);
const E=HIGH?32768:(mobile?9216:16384);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070b11);
scene.fog=new THREE.FogExp2(0x070b11,0.018);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.05,500);
camera.position.set(8,7,12);
const renderer=new THREE.WebGLRenderer({antialias:!mobile,powerPreference:"high-performance"});
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=!mobile;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(0,1,0);
controls.maxPolarAngle=Math.PI*.48;
controls.minDistance=2.5;controls.maxDistance=30;

scene.add(new THREE.HemisphereLight(0x9fbfff,0x192215,1.4));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(8,14,6);sun.castShadow=!mobile;scene.add(sun);
const rim=new THREE.PointLight(0x6aa8ff,18,28);rim.position.set(-8,5,-7);scene.add(rim);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60,1,1),new THREE.MeshStandardMaterial({color:0x101821,roughness:.9,metalness:.03}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(60,60,0x20334a,0x13202e);grid.position.y=.002;scene.add(grid);

function mat(c,r=.6,m=.05){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}
const fly=new THREE.Group();scene.add(fly);
const abdomen=new THREE.Mesh(new THREE.SphereGeometry(.46,18,12),mat(0x252b32,.48));abdomen.scale.set(1.45,.85,.85);abdomen.position.x=-.45;abdomen.castShadow=true;fly.add(abdomen);
const thorax=new THREE.Mesh(new THREE.SphereGeometry(.42,18,12),mat(0x303740,.45));thorax.castShadow=true;fly.add(thorax);
const head=new THREE.Mesh(new THREE.SphereGeometry(.31,18,12),mat(0x343d48,.45));head.position.x=.56;head.castShadow=true;fly.add(head);
for(const sy of [-1,1]){
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.15,14,10),mat(0x7d1b25,.25,.1));eye.position.set(.76,.15*sy,.06);eye.scale.set(.8,1,.85);fly.add(eye);
  const ant=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.42,6),mat(0x2b3138,.6));ant.rotation.z=Math.PI/2.7;ant.position.set(.84,.23*sy,.22);ant.rotation.x=sy*.35;fly.add(ant);
}
const wingMat=new THREE.MeshPhysicalMaterial({color:0xb8d9ff,transparent:true,opacity:.36,roughness:.1,metalness:0,side:THREE.DoubleSide});
const wings=[];
for(const sy of [-1,1]){
  const w=new THREE.Mesh(new THREE.SphereGeometry(.45,16,8,0,Math.PI*2,0,Math.PI/2),wingMat);
  w.scale.set(1.6,.5,.07);w.position.set(-.05,.43*sy,.18);w.rotation.x=Math.PI/2;w.rotation.z=sy*.38;fly.add(w);wings.push(w);
}
const legs=[];
for(let i=0;i<3;i++)for(const sy of [-1,1]){
  const root=new THREE.Group();root.position.set(.26-i*.34,.22*sy,-.08);fly.add(root);
  const upper=new THREE.Mesh(new THREE.CylinderGeometry(.024,.02,.5,7),mat(0x1d2228,.65));upper.position.y=-.24;upper.rotation.z=sy*.65;root.add(upper);
  const lower=new THREE.Mesh(new THREE.CylinderGeometry(.018,.012,.55,7),mat(0x171b20,.65));lower.position.set(.18*sy,-.63,0);lower.rotation.z=sy*.28;root.add(lower);
  legs.push({root,upper,lower,phase:i*2.1+(sy>0?Math.PI:0)});
}
fly.position.set(0,.75,0);

const shadow=new THREE.Mesh(new THREE.CircleGeometry(.7,24),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.28,depthWrite:false}));
shadow.rotation.x=-Math.PI/2;shadow.position.y=.012;scene.add(shadow);

const trailGeom=new THREE.BufferGeometry();
const trailPts=new Float32Array(3*220);trailGeom.setAttribute("position",new THREE.BufferAttribute(trailPts,3));
const trail=new THREE.Line(trailGeom,new THREE.LineBasicMaterial({color:0x5b7ec4,transparent:true,opacity:.45}));scene.add(trail);
let trailHead=0;

function orb(color=0xffcf5b,size=.22){
  const m=new THREE.Mesh(new THREE.SphereGeometry(size,16,12),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:1.2,roughness:.3}));
  m.castShadow=true;scene.add(m);return m;
}
function box(x,z,sx=.8,sz=.8,h=1,color=0x28364a){
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,h,sz),mat(color,.75));m.position.set(x,h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);obstacles.push(m);return m;
}
function clearWorld(){
  for(const o of obstacles.splice(0)) scene.remove(o);
  for(const m of markers.splice(0)) scene.remove(m);
  if(target){scene.remove(target);target=null}
  if(predator){scene.remove(predator);predator=null}
}
function rnd(a,b){return a+Math.random()*(b-a)}
function toastMsg(t){toast.textContent=t;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),900)}

const gameInfo={
 forage:"Colete alimento. Recompensa positiva ao alcançar o alvo e custo energético por movimento.",
 maze:"Siga o gradiente de odor até a recompensa, evitando paredes. O alvo fica parcialmente oculto.",
 light:"Aprenda fototaxia: aproxime-se da fonte luminosa e estabilize a distância.",
 memory:"Memorize e visite três marcadores na ordem correta. A sequência muda por episódio.",
 escape:"Sobreviva ao predador mantendo distância e usando obstáculos como cobertura.",
 slalom:"Atravesse portais em sequência sem colidir. Treina navegação e controle motor."
};
function setupGame(){
  clearWorld();gameTimer=0;memoryStep=0;goalSequence=[];
  fly.position.set(0,.72,0);fly.rotation.set(0,0,0);vel.set(0,0,0);energy=1;
  const g=gameSel.value;gameDesc.textContent=gameInfo[g];
  if(g==="forage"){
    for(let i=0;i<14;i++) box(rnd(-9,9),rnd(-9,9),rnd(.35,1),rnd(.35,1),rnd(.4,1.5));
    target=orb(0xffcc55,.24);target.position.set(rnd(-7,7),.25,rnd(-7,7));
  }
  if(g==="maze"){
    for(let i=-4;i<=4;i++){ if(i!==0) box(i*1.7,-2,.22,3.0,1.15,0x31405b); }
    for(let i=-4;i<=4;i++){ if(i!==2) box(i*1.7,3,.22,3.0,1.15,0x31405b); }
    target=orb(0x77ff88,.22);target.position.set(6,.25,6);
  }
  if(g==="light"){
    target=orb(0xffffaa,.38);target.material.emissiveIntensity=3.2;target.position.set(rnd(-6,6),1.2,rnd(-6,6));
    for(let i=0;i<8;i++) box(rnd(-8,8),rnd(-8,8),rnd(.4,.9),rnd(.4,.9),rnd(.5,1.5));
  }
  if(g==="memory"){
    const cols=[0xff5b5b,0x59a6ff,0x75ef9c];
    for(let i=0;i<3;i++){const m=orb(cols[i],.3);m.position.set(rnd(-7,7),.3,rnd(-7,7));markers.push(m);}
    goalSequence=[0,1,2].sort(()=>Math.random()-.5);toastMsg("Sequência: "+goalSequence.map(i=>i+1).join(" → "));
  }
  if(g==="escape"){
    predator=orb(0xff3344,.5);predator.position.set(7,.5,7);
    for(let i=0;i<18;i++) box(rnd(-9,9),rnd(-9,9),rnd(.4,1.2),rnd(.4,1.2),rnd(.7,2));
  }
  if(g==="slalom"){
    for(let i=0;i<9;i++){
      const z=-8+i*2;
      box((i%2?2.4:-2.4),z,.7,.7,1.5,0x3a4b69);
      const mk=orb(0x77aaff,.17);mk.position.set(i%2?-.7:.7,.35,z);markers.push(mk);
    }
    memoryStep=0;
  }
}
gameSel.onchange=()=>{episode++;episodeEl.textContent=episode;setupGame()}
document.getElementById("newEpisode").onclick=()=>{episode++;episodeEl.textContent=episode;setupGame()}
document.getElementById("reset").onclick=()=>{totalReward=0;scoreEl.textContent="0";episode=1;episodeEl.textContent="1";brain.reset(true);setupGame()}
document.getElementById("pause").onclick=()=>{paused=!paused;document.getElementById("pause").textContent=paused?"Continuar":"Pausar"}
document.getElementById("cam").onclick=()=>{camMode=(camMode+1)%3;toastMsg(["Órbita","Seguimento","Primeira pessoa"][camMode])}

class Brain{
  constructor(n,e){
    this.n=n;this.e=e;
    this.v=new Float32Array(n);this.fire=new Uint8Array(n);this.trace=new Float32Array(n);this.bias=new Float32Array(n);
    this.src=new Uint32Array(e);this.dst=new Uint32Array(e);this.w=new Float32Array(e);
    this.inN=24;this.outStart=n-16;
    for(let i=0;i<n;i++) this.bias[i]=(Math.random()-.5)*.012;
    for(let k=0;k<e;k++){
      this.src[k]=(Math.random()*n)|0;this.dst[k]=(Math.random()*n)|0;
      this.w[k]=(Math.random()<.18?-1:1)*(0.015+Math.random()*.055);
    }
    this.reward=0;this.spikeCount=0;
  }
  reset(hard=false){this.v.fill(0);this.fire.fill(0);this.trace.fill(0);if(hard){for(let k=0;k<this.e;k++)this.w[k]*=.93}}
  step(input,reward){
    this.reward=reward;
    for(let i=0;i<this.inN;i++) this.v[i]+=input[i]||0;
    const delta=new Float32Array(this.n);
    let spikes=0;
    for(let i=0;i<this.n;i++){
      const fired=this.v[i]>.36;
      this.fire[i]=fired?1:0;
      if(fired){this.v[i]=-.08;spikes++;this.trace[i]=1}
      else{this.v[i]=this.v[i]*.944+this.bias[i];this.trace[i]*=.955}
    }
    for(let k=0;k<this.e;k++){
      const a=this.src[k],b=this.dst[k];
      if(this.fire[a]) delta[b]+=this.w[k];
      if(reward!==0 && this.fire[a]) this.w[k]=THREE.MathUtils.clamp(this.w[k]+reward*this.trace[b]*.00055,-.16,.16);
    }
    for(let i=0;i<this.n;i++) this.v[i]+=delta[i];
    this.spikeCount=this.spikeCount*.9+spikes*10*.1;
    let f=0,t=0,s=0,y=0;
    for(let i=0;i<16;i++){
      const o=Math.tanh(this.v[this.outStart+i]*3);
      if(i<4)f+=o; else if(i<8)t+=o; else if(i<12)s+=o; else y+=o;
    }
    return {forward:Math.tanh(f*.5),turn:Math.tanh(t*.5),strafe:Math.tanh(s*.5),lift:Math.tanh(y*.5)};
  }
}
const brain=new Brain(N,E);neuronsEl.textContent=N.toLocaleString("pt-BR");synapsesEl.textContent=E.toLocaleString("pt-BR");

const vel=new THREE.Vector3(),tmp=new THREE.Vector3(),forward=new THREE.Vector3(),right=new THREE.Vector3();
let rewardSignal=0,slalomIndex=0;

function sensors(){
  const a=new Float32Array(24),p=fly.position;
  const yaw=fly.rotation.y;forward.set(Math.cos(yaw),0,-Math.sin(yaw));right.set(Math.sin(yaw),0,Math.cos(yaw));
  let tx=0,tz=0,dist=10;
  const g=gameSel.value;
  const obj=(g==="memory"?markers[goalSequence[memoryStep]??0]:(g==="slalom"?markers[Math.min(slalomIndex,markers.length-1)]:target));
  if(obj){tx=obj.position.x-p.x;tz=obj.position.z-p.z;dist=Math.hypot(tx,tz)}
  const inv=1/(dist+0.2),dx=tx/(dist||1),dz=tz/(dist||1);
  a[0]=THREE.MathUtils.clamp(dx*forward.x+dz*forward.z,-1,1)*.35;
  a[1]=THREE.MathUtils.clamp(dx*right.x+dz*right.z,-1,1)*.35;
  a[2]=Math.min(1,inv*2)*.28;
  a[3]=energy*.2;
  let front=9,left=9,rightD=9;
  for(const o of obstacles){
    const ox=o.position.x-p.x,oz=o.position.z-p.z,d=Math.hypot(ox,oz);
    if(d<4){
      const nx=ox/(d||1),nz=oz/(d||1),fd=nx*forward.x+nz*forward.z,sd=nx*right.x+nz*right.z;
      if(fd>.45)front=Math.min(front,d);if(sd>.45)rightD=Math.min(rightD,d);if(sd<-.45)left=Math.min(left,d);
    }
  }
  a[4]=(1-Math.min(front,4)/4)*.28;a[5]=(1-Math.min(left,4)/4)*.28;a[6]=(1-Math.min(rightD,4)/4)*.28;
  if(predator){const dxp=predator.position.x-p.x,dzp=predator.position.z-p.z,dp=Math.hypot(dxp,dzp);a[7]=Math.min(1,1/(dp+.2)*3)*.35}
  for(let i=8;i<24;i++) a[i]=(Math.sin(performance.now()*.001*(i*.07+1)+i)*.5+.5)*.015;
  sensorText.textContent=`alvo ${dist.toFixed(1)}m · frente ${front.toFixed(1)}m · E ${(energy*100|0)}%`;
  return a;
}

function collide(){
  const p=fly.position;
  for(const o of obstacles){
    const sx=o.geometry.parameters.width/2+.3,sz=o.geometry.parameters.depth/2+.3;
    if(Math.abs(p.x-o.position.x)<sx && Math.abs(p.z-o.position.z)<sz){
      tmp.set(p.x-o.position.x,0,p.z-o.position.z).normalize();p.addScaledVector(tmp,.18);vel.multiplyScalar(.4);rewardSignal-=.015;return true;
    }
  }return false;
}

function updateGame(dt){
  gameTimer+=dt;const p=fly.position,g=gameSel.value;
  if(g==="forage"||g==="maze"||g==="light"){
    if(target){
      const d=p.distanceTo(target.position);
      if(g==="light"){
        const ideal=1.4;rewardSignal+=Math.max(-.002,.003-Math.abs(d-ideal)*.001);
      }else rewardSignal+=Math.max(-.001,.0015-d*.00007);
      if(d<.55){
        totalReward+=10;scoreEl.textContent=totalReward.toFixed(0);energy=Math.min(1,energy+.3);
        target.position.set(rnd(-7,7),target.position.y,rnd(-7,7));rewardSignal+=.25;toastMsg("+10");
      }
    }
  }else if(g==="memory"){
    const idx=goalSequence[memoryStep],m=markers[idx];
    if(m&&p.distanceTo(m.position)<.6){
      memoryStep++;rewardSignal+=.22;totalReward+=8;scoreEl.textContent=totalReward.toFixed(0);
      toastMsg(memoryStep>=3?"Sequência completa!":"Correto");
      if(memoryStep>=3){episode++;episodeEl.textContent=episode;setupGame()}
    }
  }else if(g==="escape"){
    if(predator){
      const dir=tmp.copy(p).sub(predator.position);const d=Math.max(.1,dir.length());dir.normalize();
      predator.position.addScaledVector(dir,dt*(1.2+Math.min(1,gameTimer/40)));
      if(d<.8){totalReward-=15;scoreEl.textContent=totalReward.toFixed(0);rewardSignal-=.3;episode++;episodeEl.textContent=episode;setupGame();toastMsg("Capturada")}
      else{rewardSignal+=Math.min(.003,d*.00018);totalReward+=dt*.15;scoreEl.textContent=totalReward.toFixed(0)}
    }
  }else if(g==="slalom"){
    const m=markers[slalomIndex];
    if(m&&p.distanceTo(m.position)<.55){
      slalomIndex++;rewardSignal+=.2;totalReward+=6;scoreEl.textContent=totalReward.toFixed(0);toastMsg("Portal "+slalomIndex+"/"+markers.length);
      if(slalomIndex>=markers.length){episode++;episodeEl.textContent=episode;setupGame();slalomIndex=0}
    }
  }
}

function step(dt){
  rewardSignal*=.92;
  const out=brain.step(sensors(),rewardSignal);
  const yaw=fly.rotation.y;
  forward.set(Math.cos(yaw),0,-Math.sin(yaw));right.set(Math.sin(yaw),0,Math.cos(yaw));
  const aiF=out.forward*.62+.38,aiT=out.turn*.58,aiS=out.strafe*.25;
  const uf=userY,ut=userX;
  fly.rotation.y+=((aiT+ut*.9)*1.45)*dt;
  vel.addScaledVector(forward,(aiF+uf*.9)*(boost?5.8:3.2)*dt);
  vel.addScaledVector(right,aiS*1.7*dt);
  vel.multiplyScalar(Math.pow(.12,dt));
  const cap=boost?6.5:3.8;if(vel.length()>cap)vel.setLength(cap);
  fly.position.addScaledVector(vel,dt);
  fly.position.x=THREE.MathUtils.clamp(fly.position.x,-12,12);fly.position.z=THREE.MathUtils.clamp(fly.position.z,-12,12);
  fly.position.y=.72+Math.sin(performance.now()*.006)*.05+out.lift*.06;
  energy=Math.max(0,energy-dt*(.003+.008*vel.length()/cap+(boost?.012:0)));
  if(energy<=0){rewardSignal-=.03;vel.multiplyScalar(.93)}
  collide();updateGame(dt);
  speedEl.textContent=vel.length().toFixed(1);energyBar.style.width=(energy*100).toFixed(1)+"%";
  spikesEl.textContent=Math.round(brain.spikeCount).toLocaleString("pt-BR");

  const t=performance.now()*.001,spd=Math.min(1,vel.length()/3);
  for(const l of legs){
    const a=Math.sin(t*(5+spd*7)+l.phase)*(.18+.35*spd);l.root.rotation.x=a;
  }
  wings[0].rotation.y=Math.sin(t*45)*.38;wings[1].rotation.y=-Math.sin(t*45)*.38;
  abdomen.rotation.z=Math.sin(t*2.3)*.035;
  shadow.position.set(fly.position.x,.012,fly.position.z);
  const pa=trailGeom.attributes.position.array;const idx=(trailHead++%220)*3;pa[idx]=fly.position.x;pa[idx+1]=.03;pa[idx+2]=fly.position.z;trailGeom.attributes.position.needsUpdate=true;

  if(camMode===1){
    tmp.set(fly.position.x-5*Math.cos(yaw),3.2,fly.position.z+5*Math.sin(yaw));
    camera.position.lerp(tmp,.06);controls.target.lerp(fly.position,.1);
  }else if(camMode===2){
    tmp.set(fly.position.x+.75*Math.cos(yaw),fly.position.y+.28,fly.position.z-.75*Math.sin(yaw));
    camera.position.lerp(tmp,.18);controls.target.copy(fly.position).addScaledVector(forward,3);
  }
}

function drawNeuro(){
  const w=ncv.width,h=ncv.height;nctx.fillStyle="#080d14";nctx.fillRect(0,0,w,h);
  const bins=64,barW=w/bins;
  for(let b=0;b<bins;b++){
    let s=0;const start=(b*brain.n/bins)|0,end=((b+1)*brain.n/bins)|0;
    for(let i=start;i<end;i++)s+=brain.fire[i];
    const q=Math.min(1,s/Math.max(1,(end-start)*.22));const bh=4+q*(h-12);
    nctx.fillStyle=`rgba(${80+q*90},${130+q*100},255,${.32+q*.65})`;nctx.fillRect(b*barW+1,h-bh,barW-2,bh);
  }
}

const keys={};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
function readKeys(){userY=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);userX=(keys.a||keys.arrowleft?1:0)-(keys.d||keys.arrowright?1:0);boost=!!keys.shift}

const joy=document.getElementById("joy");let joyId=null;
function joyMove(e){
  const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy),lim=r.width*.38,k=m>lim?lim/m:1;
  userX=THREE.MathUtils.clamp(dx*k/lim,-1,1);userY=THREE.MathUtils.clamp(-dy*k/lim,-1,1);
}
joy.addEventListener("pointerdown",e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener("pointermove",e=>{if(e.pointerId===joyId)joyMove(e)});
joy.addEventListener("pointerup",e=>{if(e.pointerId===joyId){joyId=null;userX=userY=0}});
document.getElementById("boost").addEventListener("pointerdown",()=>boost=true);
document.getElementById("boost").addEventListener("pointerup",()=>boost=false);

function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
addEventListener("resize",resize);

async function loadFlyWireIds(){
  try{
    const r=await fetch("https://zenodo.org/records/10676866/files/proofread_root_ids_783.npy?download=1",{mode:"cors"});
    if(!r.ok)throw 0;
    const b=await r.arrayBuffer(),u=new Uint8Array(b);
    if(u[0]!==0x93)throw 0;
    statusEl.textContent=`WebGL ativo · ${HIGH?"MAX":"adaptativo"} · dataset FlyWire acessível · dinâmica neural local`;
    statusEl.style.color="#78efb1";
  }catch{
    statusEl.textContent=`WebGL ativo · ${HIGH?"MAX":"adaptativo"} · modo neural local (dataset remoto bloqueado pelo navegador)`;
    statusEl.style.color="#ffd166";
  }
}
loadFlyWireIds();

setupGame();
gameDesc.textContent=gameInfo[gameSel.value];

function animate(now){
  requestAnimationFrame(animate);
  let dt=Math.min(.033,(now-last)/1000);last=now;
  if(!paused){readKeys();step(dt)}
  controls.enabled=camMode===0;controls.update();
  renderer.render(scene,camera);
  drawNeuro();
  fpsAcc+=1;
  if(now-fpsLast>500){fpsEl.textContent=Math.round(fpsAcc*1000/(now-fpsLast));fpsAcc=0;fpsLast=now}
}
requestAnimationFrame(animate);
</script>
