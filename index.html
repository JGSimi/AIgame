<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Mosquinha Neural — v2</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#eef2ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;left:10px;top:max(10px,env(safe-area-inset-top));right:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
  .panel{background:#111622dc;border:1px solid #283142;border-radius:14px;padding:10px 12px;backdrop-filter:blur(10px);box-shadow:0 8px 30px #0006;pointer-events:auto}
  h1{font-size:14px;margin:0 0 5px}
  #status{font-size:11px;color:#aab4c8;max-width:330px}
  #stats{font-size:11px;color:#aab4c8;margin-top:5px}
  #stats b{color:#fff}
  button{border:1px solid #2c3547;background:#171d29;color:#fff;border-radius:10px;padding:8px 10px;font-weight:700}
  button:active{transform:scale(.97)}
  #hint{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:11px;background:#111622dc;border:1px solid #283142;padding:7px 10px;border-radius:999px;color:#cbd4e5;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="panel">
    <h1>🪰 Mosquinha Neural v2</h1>
    <div id="status">Simulação local iniciada. Tentando buscar dados públicos do FlyWire…</div>
    <div id="stats"><b id="n">160</b> neurônios · <b id="e">480</b> conexões · comida: <b id="score">0</b></div>
  </div>
  <div class="panel"><button id="reset">Reset</button></div>
</div>
<div id="hint">Toque/clique para mover a comida</div>

<script>
(function(){
"use strict";

const c=document.getElementById("c");
const x=c.getContext("2d",{alpha:false});
const status=document.getElementById("status");
const NEl=document.getElementById("n");
const EEl=document.getElementById("e");
const scoreEl=document.getElementById("score");

let W=0,H=0,D=Math.min(window.devicePixelRatio||1,2),last=performance.now(),score=0;
let food={x:0,y:0}, fly={x:0,y:0,vx:0,vy:0,a:0};
let nodes=[],edges=[],usingRealIds=false;

function resize(){
  W=innerWidth; H=innerHeight;
  c.width=Math.round(W*D); c.height=Math.round(H*D);
  c.style.width=W+"px"; c.style.height=H+"px";
  x.setTransform(D,0,0,D,0,0);
  if(!food.x){food.x=W*.72;food.y=H*.55;fly.x=W*.28;fly.y=H*.55;}
}
addEventListener("resize",resize,{passive:true}); resize();

function hash(s){
  let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}
function rand(h,k){
  let z=(h+Math.imul(k+1,0x9e3779b1))>>>0;
  z^=z<<13;z^=z>>>17;z^=z<<5;return (z>>>0)/4294967295;
}

function makeNetwork(ids){
  const n=Math.min(ids.length,innerWidth<700?160:260);
  const chosen=[];
  const step=Math.max(1,Math.floor(ids.length/n));
  for(let i=0;i<ids.length && chosen.length<n;i+=step) chosen.push(String(ids[i]));

  nodes=chosen.map((id,i)=>{
    const h=hash(id), ang=i/chosen.length*Math.PI*2 + rand(h,3)*.35;
    const rr=Math.min(W,H)*(.11+.08*rand(h,4));
    return {id,h,v:0,x:W*.5+Math.cos(ang)*rr,y:H*.5+Math.sin(ang)*rr};
  });
  edges=[];
  for(let i=0;i<nodes.length;i++){
    const h=nodes[i].h;
    for(let k=0;k<3;k++){
      const j=(i+1+Math.floor(rand(h,k+8)*(nodes.length-1)))%nodes.length;
      edges.push([i,j,(rand(h,k+30)>.2?1:-1)*(.03+rand(h,k+60)*.09)]);
    }
  }
  NEl.textContent=nodes.length; EEl.textContent=edges.length;
}

function fallback(){
  const ids=Array.from({length:260},(_,i)=>"demo-"+i);
  makeNetwork(ids);
}
fallback();

function reset(){
  fly.x=W*.28;fly.y=H*.55;fly.vx=fly.vy=0;
  food.x=W*.72;food.y=H*.55;score=0;scoreEl.textContent="0";
  nodes.forEach(n=>n.v=0);
}
document.getElementById("reset").onclick=reset;

function moveFood(clientX,clientY){
  food.x=Math.max(20,Math.min(W-20,clientX));
  food.y=Math.max(20,Math.min(H-20,clientY));
}
c.addEventListener("pointerdown",e=>moveFood(e.clientX,e.clientY),{passive:true});
c.addEventListener("touchstart",e=>{
  if(e.touches[0]) moveFood(e.touches[0].clientX,e.touches[0].clientY);
},{passive:true});

function tick(dt){
  let dx=food.x-fly.x,dy=food.y-fly.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;

  for(const n of nodes)n.v*=.92;
  for(let i=0;i<Math.min(12,nodes.length);i++){
    nodes[i].v += ((i&1)?ny:nx)*.28 + Math.max(0,1-d/Math.max(W,H))*.03;
  }
  const add=new Float32Array(nodes.length);
  for(const [a,b,w] of edges)add[b]+=Math.tanh(nodes[a].v*2)*w;
  for(let i=0;i<nodes.length;i++)nodes[i].v+=add[i];

  let mx=0,my=0,base=Math.max(0,nodes.length-16);
  for(let i=base;i<nodes.length;i++){
    const o=Math.tanh(nodes[i].v*2);
    if(i%4===0)mx+=o; else if(i%4===1)mx-=o; else if(i%4===2)my+=o; else my-=o;
  }

  mx=mx*.12+nx*.90; my=my*.12+ny*.90;
  fly.vx=fly.vx*.91+mx*65*dt; fly.vy=fly.vy*.91+my*65*dt;
  const sp=Math.hypot(fly.vx,fly.vy),cap=145;
  if(sp>cap){fly.vx*=cap/sp;fly.vy*=cap/sp;}
  fly.x+=fly.vx*dt;fly.y+=fly.vy*dt;fly.a=Math.atan2(fly.vy,fly.vx);

  if(d<23){
    score++;scoreEl.textContent=String(score);
    food.x=30+Math.random()*(W-60);food.y=70+Math.random()*(H-120);
    nodes.forEach(n=>n.v*=.15);
  }
}

function flyDraw(){
  x.save();x.translate(fly.x,fly.y);x.rotate(fly.a);
  x.fillStyle="#222a38";x.strokeStyle="#e8eefc";x.lineWidth=1.3;
  x.beginPath();x.ellipse(0,0,11,5,0,0,Math.PI*2);x.fill();x.stroke();
  x.fillStyle="#71809a99";
  x.beginPath();x.ellipse(-2,-7,9,3,-.35,0,Math.PI*2);x.fill();
  x.beginPath();x.ellipse(-2,7,9,3,.35,0,Math.PI*2);x.fill();
  x.fillStyle="#76f0b3";x.beginPath();x.arc(9,0,3,0,Math.PI*2);x.fill();
  x.restore();
}
function draw(){
  x.fillStyle="#090b10";x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H)*.7);
  g.addColorStop(0,"#121827");g.addColorStop(1,"#090b10");x.fillStyle=g;x.fillRect(0,0,W,H);

  for(let k=0;k<Math.min(edges.length,600);k++){
    const [a,b,w]=edges[k],A=nodes[a],B=nodes[b];
    x.strokeStyle=w>0?"rgba(118,240,179,.055)":"rgba(255,120,120,.05)";
    x.lineWidth=.5;x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.stroke();
  }
  for(const n of nodes){
    const q=Math.min(1,Math.abs(n.v)*3);
    x.fillStyle="rgba(205,220,255,"+(.14+q*.72)+")";
    x.beginPath();x.arc(n.x,n.y,1.2+q*1.8,0,Math.PI*2);x.fill();
  }

  x.fillStyle="#ffd166";x.beginPath();x.arc(food.x,food.y,8,0,Math.PI*2);x.fill();
  x.strokeStyle="#ffd16688";x.lineWidth=2;x.beginPath();x.arc(food.x,food.y,15,0,Math.PI*2);x.stroke();
  flyDraw();
}

function frame(now){
  const dt=Math.min(.035,(now-last)/1000);last=now;
  tick(dt);draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

async function tryFlyWire(){
  const urls=[
    "https://zenodo.org/records/10676866/files/proofread_root_ids_783.npy?download=1"
  ];
  try{
    const ctl=new AbortController();
    setTimeout(()=>ctl.abort(),7000);
    const r=await fetch(urls[0],{signal:ctl.signal,mode:"cors"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const b=await r.arrayBuffer();

    const u=new Uint8Array(b);
    if(u[0]!==0x93 || String.fromCharCode(...u.slice(1,6))!=="NUMPY") throw new Error("NPY");
    const major=u[6];
    const hl=major===1?(u[8]|u[9]<<8):(u[8]|u[9]<<8|u[10]<<16|u[11]<<24);
    const off=(major===1?10:12)+hl;
    const count=Math.floor((b.byteLength-off)/8);
    const view=new DataView(b,off);
    const ids=[];
    const target=innerWidth<700?180:280;
    const step=Math.max(1,Math.floor(count/target));
    for(let i=0;i<count && ids.length<target;i+=step){
      if(typeof view.getBigUint64==="function") ids.push(view.getBigUint64(i*8,true).toString());
      else break;
    }
    if(ids.length>20){
      makeNetwork(ids);
      usingRealIds=true;
      status.textContent="FlyWire conectado: usando IDs reais do snapshot v783. A dinâmica/conexões continuam simplificadas.";
      status.style.color="#76f0b3";
    }else throw new Error("BigInt indisponível");
  }catch(e){
    status.textContent="Modo local ativo. O navegador bloqueou o download direto do FlyWire, mas a simulação continua funcionando.";
    status.style.color="#ffd166";
  }
}
tryFlyWire();
})();
</script>
</body>
</html>
