<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>FlyLab Neural</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#070a0f;color:#eef4ff;font:14px system-ui}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.p{position:fixed;z-index:5;background:#111722e8;border:1px solid #273248;border-radius:14px;backdrop-filter:blur(10px)}#top{left:10px;right:10px;top:10px;padding:10px;display:flex;justify-content:space-between;gap:8px}.small{font-size:11px;color:#9eabc0}.box{top:92px;padding:10px;width:250px}#left{left:10px}#right{right:10px;width:275px}button,select{background:#17202d;color:#eef4ff;border:1px solid #273248;border-radius:9px;padding:8px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{background:#0b111a;border:1px solid #202a3a;border-radius:9px;padding:7px}.stat b{display:block;font-size:16px}.stat span{font-size:10px;color:#9eabc0}#neuro{width:100%;height:110px;background:#080d14;border:1px solid #202a3a;border-radius:9px}.err{color:#ff9b9b}@media(max-width:700px){#left{display:none}#right{left:10px;right:10px;top:auto;bottom:10px;width:auto}#right .extra{display:none}}</style></head><body><div id="stage"></div><div id="top" class="p"><div><b>🪰 FlyLab Neural — FlyBody</b><div id="status" class="small">Inicializando…</div></div><div><button id="pause">Pausar</button> <button id="reset">Zerar cérebro</button></div></div><div id="left" class="p box"><div class="small">TREINAMENTO</div><select id="game"><option value="forage">Forrageamento</option><option value="maze">Labirinto</option><option value="light">Fototaxia</option><option value="escape">Predador</option></select><p id="desc" class="small"></p><button id="episode">Novo episódio</button><hr><div class="grid"><div class="stat"><b id="fps">0</b><span>FPS</span></div><div class="stat"><b id="speed">0.00</b><span>velocidade</span></div><div class="stat"><b id="score">0</b><span>recompensa</span></div><div class="stat"><b id="ep">1</b><span>episódio</span></div></div></div><div id="right" class="p box"><div class="grid"><div class="stat"><b id="neurons">0</b><span>neurônios</span></div><div class="stat"><b id="synapses">0</b><span>sinapses</span></div><div class="stat"><b id="spikes">0</b><span>spikes/s</span></div><div class="stat"><b id="meshes">0</b><span>meshes FlyBody</span></div></div><p id="motor" class="small">motores: —</p><canvas id="neuro" width="560" height="220"></canvas><p id="sensor" class="small extra">sensores: —</p><p id="error" class="small err"></p></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js/+esm';import {OBJLoader} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/OBJLoader.js/+esm';const $=s=>document.querySelector(s),stage=$('#stage'),status=$('#status'),fpsEl=$('#fps'),speedEl=$('#speed'),scoreEl=$('#score'),epEl=$('#ep'),neuronsEl=$('#neurons'),synEl=$('#synapses'),spikesEl=$('#spikes'),meshesEl=$('#meshes'),motorEl=$('#motor'),sensorEl=$('#sensor'),errorEl=$('#error'),game=$('#game'),desc=$('#desc'),nc=$('#neuro'),nx=nc.getContext('2d');const mobile=matchMedia('(max-width:700px)').matches,N=mobile?1536:4096,E=mobile?14000:42000;neuronsEl.textContent=N.toLocaleString('pt-BR');synEl.textContent=E.toLocaleString('pt-BR');let paused=false,last=performance.now(),fpsN=0,fpsT=performance.now(),score=0,episode=1,time=0,reward=0,meshCount=0,target=null,predator=null;const scene=new THREE.Scene();scene.background=new THREE.Color(0x070b11);scene.fog=new THREE.FogExp2(0x070b11,.015);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.02,200);camera.position.set(7,5,10);const renderer=new THREE.WebGLRenderer({antialias:!mobile,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.2,0);scene.add(new THREE.HemisphereLight(0xb8c9ff,0x1c2417,1.8));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(7,12,6);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(28,28),new THREE.MeshStandardMaterial({color:0x111923,roughness:.95}));ground.rotation.x=-Math.PI/2;scene.add(ground);scene.add(new THREE.GridHelper(28,28,0x20334a,0x13202e));const obstacles=[];const locomotion=new THREE.Group();scene.add(locomotion);locomotion.position.set(-6,.08,0);const flyRoot=new THREE.Group();flyRoot.rotation.x=-Math.PI/2;flyRoot.scale.setScalar(.30);locomotion.add(flyRoot);const vel=new THREE.Vector3(),forward=new THREE.Vector3(),tmp=new THREE.Vector3();function wall(x,z,w,d,h=.7,c=0x31405b){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.82}));m.position.set(x,h/2,z);scene.add(m);obstacles.push(m)}function orb(c,s=.14){const m=new THREE.Mesh(new THREE.SphereGeometry(s,16,12),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.8}));scene.add(m);return m}function clearMap(){while(obstacles.length)scene.remove(obstacles.pop());if(target){scene.remove(target);target=null}if(predator){scene.remove(predator);predator=null}}const descs={forage:'Arena aberta com ilhas; somente odor bilateral e proximidade.',maze:'Labirinto fixo; sem direção pronta ou steering.',light:'Fonte luminosa central; somente fotorreceptores bilaterais.',escape:'Predador móvel; rede precisa aprender evasão.'};function setup(){clearMap();vel.set(0,0,0);locomotion.position.set(-6,.08,0);locomotion.rotation.y=0;desc.textContent=descs[game.value];if(game.value==='forage'){[[0,0,2.2,1],[3.5,3,1.5,2],[-3,-3,2.2,.8],[4,-3,1.2,2]].forEach(a=>wall(...a));target=orb(0xffcc55,.15);target.position.set(5,.16,-4)}else if(game.value==='maze'){wall(0,-5,13,.25);wall(0,5,13,.25);wall(-6.5,0,.25,10);wall(6.5,0,.25,10);wall(-3,-2,.25,6);wall(0,2,.25,6);wall(3,-2,.25,6);target=orb(0x78ef9b,.15);target.position.set(5.5,.16,4);locomotion.position.set(-5.5,.08,-4)}else if(game.value==='light'){for(let i=0;i<12;i++){if([2,6,9].includes(i))continue;const a=i*Math.PI*2/12,x=Math.cos(a)*4.5,z=Math.sin(a)*4.5;const m=wall(x,z,.2,1.8,1,0x384864)}target=orb(0xffffaa,.24);target.position.set(0,.7,0)}else{[[-3,-3,2.5,.5],[3,-3,2.5,.5],[-3,3,2.5,.5],[3,3,2.5,.5],[0,0,.7,4]].forEach(a=>wall(...a,1.1));predator=orb(0xff3344,.28);predator.position.set(5,.3,5);locomotion.position.set(-5,.08,-5)}}class Brain{constructor(n,e){this.n=n;this.e=e;this.v=new Float32Array(n);this.fire=new Uint8Array(n);this.src=new Uint32Array(e);this.dst=new Uint32Array(e);this.w=new Float32Array(e);this.add=new Float32Array(n);this.pre=new Float32Array(n);this.post=new Float32Array(n);this.elig=new Float32Array(e);this.motor=n-128;this.rate=new Float32Array(4);this.sp=0;for(let k=0;k<e;k++){this.src[k]=Math.random()*n|0;this.dst[k]=Math.random()*n|0;this.w[k]=(Math.random()<.2?-1:1)*(.03+Math.random()*.08)}}reset(){this.v.fill(0);this.fire.fill(0);this.pre.fill(0);this.post.fill(0);this.elig.fill(0);this.rate.fill(0)}step(inp,r){for(let c=0;c<16;c++)for(let j=0;j<14;j++){const i=c*14+j;this.v[i]+=inp[c]*(.08+.02*j)}this.add.fill(0);let s=0;for(let i=0;i<this.n;i++){this.v[i]=this.v[i]*.97+.004+(Math.random()-.5)*.018;if(this.v[i]>.62){this.fire[i]=1;this.v[i]=-.12;this.pre[i]=this.post[i]=1;s++}else{this.fire[i]=0;this.pre[i]*=.94;this.post[i]*=.94}}for(let k=0;k<this.e;k++){const a=this.src[k],b=this.dst[k];if(this.fire[a])this.add[b]+=this.w[k];this.elig[k]*=.988;if(this.fire[a])this.elig[k]+=this.post[b];if(this.fire[b])this.elig[k]-=.4*this.pre[a];if(r)this.w[k]=THREE.MathUtils.clamp(this.w[k]+r*this.elig[k]*.0002,-.3,.3)}for(let i=0;i<this.n;i++)this.v[i]+=this.add[i];this.sp=this.sp*.9+s*6;for(let p=0;p<4;p++){let f=0;for(let i=this.motor+p*32;i<this.motor+(p+1)*32;i++)f+=this.fire[i];this.rate[p]=this.rate[p]*.85+f/32*.15}const l=THREE.MathUtils.clamp((this.rate[0]-this.rate[2])*7,-1,1),rr=THREE.MathUtils.clamp((this.rate[1]-this.rate[3])*7,-1,1);return{left:l,right:rr,forward:(l+rr)*.5,turn:(rr-l)}}}const brain=new Brain(N,E);let lastMotor={left:0,right:0,forward:0,turn:0};function ray(angle,max=3){const y=locomotion.rotation.y+angle,p=locomotion.position,dx=Math.cos(y),dz=-Math.sin(y);let best=max;for(const o of obstacles){const w=o.geometry.parameters.width/2+.1,d=o.geometry.parameters.depth/2+.1;for(let t=.1;t<=max;t+=.12){const x=p.x+dx*t,z=p.z+dz*t;if(Math.abs(x-o.position.x)<w&&Math.abs(z-o.position.z)<d){best=t;break}}}return best}function pair(o,odor=true){if(!o)return[0,0];const p=locomotion.position,dx=o.position.x-p.x,dz=o.position.z-p.z,dist=Math.hypot(dx,dz)||.001,ang=Math.atan2(-dz,dx)-locomotion.rotation.y,side=Math.sin(ang),front=Math.max(0,Math.cos(ang)),base=odor?Math.exp(-dist/4):Math.exp(-dist/7)*front;return[THREE.MathUtils.clamp(base*(1-side*.7),0,1),THREE.MathUtils.clamp(base*(1+side*.7),0,1)]}function sensors(){const a=new Float32Array(16),odor=pair(target,true),vis=pair(target,false),f=ray(0),l=ray(.65),r=ray(-.65);a[0]=odor[0];a[1]=odor[1];a[2]=vis[0];a[3]=vis[1];a[4]=1-f/3;a[5]=1-l/3;a[6]=1-r/3;a[7]=Math.min(1,vel.length()/2);a[8]=Math.max(0,lastMotor.left);a[9]=Math.max(0,lastMotor.right);a[10]=Math.max(0,-lastMotor.left);a[11]=Math.max(0,-lastMotor.right);if(predator){const d=pair(predator,false);a[12]=d[0];a[13]=d[1]}a[14]=.1;a[15]=.1;sensorEl.textContent=`odor ${odor[0].toFixed(2)}/${odor[1].toFixed(2)} · visão ${vis[0].toFixed(2)}/${vis[1].toFixed(2)} · prox ${(a[4]).toFixed(2)}/${(a[5]).toFixed(2)}/${(a[6]).toFixed(2)}`;return a}function collide(){for(const o of obstacles){const p=locomotion.position,w=o.geometry.parameters.width/2+.08,d=o.geometry.parameters.depth/2+.08;if(Math.abs(p.x-o.position.x)<w&&Math.abs(p.z-o.position.z)<d){tmp.set(p.x-o.position.x,0,p.z-o.position.z).normalize();p.addScaledVector(tmp,.1);vel.multiplyScalar(.25);reward-=.08;return}}}function updateGame(dt){if(target&&locomotion.position.distanceTo(target.position)<.3){score+=1;scoreEl.textContent=score.toFixed(1);reward+=1;if(game.value==='forage')target.position.set(-5+Math.random()*10,.16,-4+Math.random()*8)}if(game.value==='light'&&target){const d=locomotion.position.distanceTo(target.position);if(d<1){score+=dt*.1;scoreEl.textContent=score.toFixed(1);reward+=dt*.04}}if(predator){tmp.copy(locomotion.position).sub(predator.position);if(tmp.lengthSq()<.001)tmp.set(1,0,0);tmp.normalize();predator.position.addScaledVector(tmp,dt*.8);if(locomotion.position.distanceTo(predator.position)<.35){reward-=1;episode++;epEl.textContent=episode;setup()}}}function step(dt){time+=dt;reward*=.92;const out=brain.step(sensors(),reward);lastMotor=out;locomotion.rotation.y+=out.turn*1.8*dt;forward.set(Math.cos(locomotion.rotation.y),0,-Math.sin(locomotion.rotation.y));vel.addScaledVector(forward,out.forward*2.2*dt);vel.multiplyScalar(Math.pow(.16,dt));if(vel.length()>2)vel.setLength(2);locomotion.position.addScaledVector(vel,dt);locomotion.position.x=THREE.MathUtils.clamp(locomotion.position.x,-7,7);locomotion.position.z=THREE.MathUtils.clamp(locomotion.position.z,-7,7);collide();updateGame(dt);speedEl.textContent=vel.length().toFixed(2);spikesEl.textContent=Math.round(brain.sp).toLocaleString('pt-BR');motorEl.textContent=`motores E ${out.left.toFixed(2)} · D ${out.right.toFixed(2)} · avanço ${out.forward.toFixed(2)} · giro ${out.turn.toFixed(2)}`}function drawNeuro(){nx.fillStyle='#080d14';nx.fillRect(0,0,nc.width,nc.height);nx.strokeStyle='#7aa8ff';nx.beginPath();for(let b=0;b<72;b++){let v=0,c=0;const s=(b*brain.n/72)|0,e=((b+1)*brain.n/72)|0;for(let i=s;i<e;i+=3){v+=Math.abs(brain.v[i]);c++}const x=b*nc.width/72,y=nc.height*.7-Math.min(.8,v/Math.max(1,c))*nc.height*.5;if(!b)nx.moveTo(x,y);else nx.lineTo(x,y)}nx.stroke()}async function loadFlyBody(){const BASE='https://cdn.jsdelivr.net/gh/google-deepmind/mujoco_menagerie@main/flybody/',ASSET=BASE+'assets/';try{const x=await (await fetch(BASE+'fruitfly.xml')).text(),xml=new DOMParser().parseFromString(x,'application/xml'),meshes=new Map(),mats=new Map();xml.querySelectorAll('asset > mesh').forEach(m=>meshes.set(m.getAttribute('name'),m.getAttribute('file')));xml.querySelectorAll('asset > material').forEach(m=>mats.set(m.getAttribute('name'),m.getAttribute('rgba')||'.45 .3 .18 1'));const loader=new OBJLoader();function v(s,d=[0,0,0]){return(s||d.join(' ')).trim().split(/\s+/).map(Number)}function q(s){const a=v(s,[1,0,0,0]);return new THREE.Quaternion(a[1],a[2],a[3],a[0])}function build(b,p){const g=new THREE.Group();g.position.set(...v(b.getAttribute('pos')));g.quaternion.copy(q(b.getAttribute('quat')));p.add(g);for(const ge of [...b.children].filter(n=>n.tagName==='geom')){const mn=ge.getAttribute('mesh');if(!mn||!meshes.has(mn))continue;const h=new THREE.Group();h.position.set(...v(ge.getAttribute('pos')));h.quaternion.copy(q(ge.getAttribute('quat')));g.add(h);loader.load(ASSET+meshes.get(mn),obj=>{const rgba=v(mats.get(ge.getAttribute('material'))||'.45 .3 .18 1');obj.traverse(o=>{if(o.isMesh)o.material=new THREE.MeshStandardMaterial({color:new THREE.Color(rgba[0],rgba[1],rgba[2]),transparent:rgba[3]<.99,opacity:rgba[3],roughness:.6,side:THREE.DoubleSide})});h.add(obj);meshCount++;meshesEl.textContent=meshCount},undefined,()=>{})}for(const c of [...b.children].filter(n=>n.tagName==='body'))build(c,g)}build(xml.querySelector('worldbody > body[name="thorax"]'),flyRoot);status.textContent='FlyBody oficial carregado · render isolado · controle neural';status.style.color='#78efb1'}catch(e){status.textContent='Cena ativa; FlyBody falhou ao carregar';errorEl.textContent=String(e)}}$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'Continuar':'Pausar'};$('#reset').onclick=()=>{brain.reset();score=0;scoreEl.textContent='0';setup()};$('#episode').onclick=()=>{episode++;epEl.textContent=episode;setup()};game.onchange=()=>{episode++;epEl.textContent=episode;setup()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setup();loadFlyBody();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.033,(now-last)/1000);last=now;try{if(!paused)step(dt)}catch(e){errorEl.textContent='Erro neural: '+e.message}try{controls.update();renderer.render(scene,camera);drawNeuro()}catch(e){errorEl.textContent='Erro render: '+e.message}fpsN++;if(now-fpsT>500){fpsEl.textContent=Math.round(fpsN*1000/(now-fpsT));fpsN=0;fpsT=now}}requestAnimationFrame(loop);</script></body></html>
